services:
  postgres:
    image: postgres:16
    container_name: panenku-db
    env_file: ../.env.local
    ports: ["${DB_PORT}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
    networks: [panenku-net]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: panenku-backend
    env_file: ../.env.local
    ports: ["${BACKEND_PORT}:3000"]
    depends_on: [postgres]
    networks: [panenku-net]
    develop:
      watch:
        - action: sync
          path: ../backend/src
          target: /app/src
        - action: rebuild
          path: ../backend/package.json

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: panenku-frontend
    env_file: ../.env.local
    ports: ["${FRONTEND_PORT}:5173"]
    depends_on: [backend]
    networks: [panenku-net]
    develop:
      watch:
        - action: sync
          path: ../frontend/src
          target: /app/src
        - action: sync
          path: ../frontend/public
          target: /app/public
        - action: sync
          path: ../frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ../frontend/package.json

  nginx:
    image: nginx:alpine
    container_name: panenku-proxy
    ports: ["${NGINX_PORT}:80"]
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/templates/default.conf.template
    environment:
      BACKEND_URL: ${PROXY_BACKEND}
      FRONTEND_URL: ${PROXY_FRONTEND}
    command:
      - sh
      - -c
      - |
        envsubst '$$BACKEND_URL $$FRONTEND_URL' \
          < /etc/nginx/templates/default.conf.template \
          > /etc/nginx/conf.d/default.conf \
        && nginx -g 'daemon off;'
    depends_on: [frontend, backend]
    networks: [panenku-net]

volumes:
  postgres_data:

networks:
  panenku-net:
