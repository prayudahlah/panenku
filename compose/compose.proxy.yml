services:
  nginx:
    image: nginx:alpine
    container_name: panenku-proxy
    ports: ["0.0.0.0:${NGINX_PORT}:80"]
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      BACKEND_URL: ${PROXY_BACKEND}
      FRONTEND_URL: ${PROXY_FRONTEND}
    dns:
      - 100.100.100.100
